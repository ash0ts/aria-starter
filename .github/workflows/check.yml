name: Check starter notebooks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.27"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "*.py.lock"
      - name: Check notebook structure
        run: uv --no-config tool run --from marimo==0.25.2 marimo check train_classifier.py build_agent.py finetune_classifier.py
      - name: Check Python lint and formatting
        run: |
          uv --no-config tool run ruff==0.17.1 check train_classifier.py build_agent.py finetune_classifier.py test_starter.py
          uv --no-config tool run ruff==0.17.1 format --check train_classifier.py build_agent.py finetune_classifier.py test_starter.py
      - name: Verify locked standalone installations
        run: |
          for notebook in train_classifier.py build_agent.py finetune_classifier.py; do
            uv --no-config run --locked --python 3.12 --script "$notebook"
          done
      - name: Run offline regression checks
        run: uv --no-config run --locked --python 3.12 --script test_starter.py
